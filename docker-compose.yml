services:
  api:
    build:
      context: ./api
    container_name: trajectory-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./web
    container_name: trajectory-web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
